<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases disponibles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 25px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #243447;
        }

        .acciones {
            margin: 20px 0;
        }

        .boton {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .azul {
            background: #2874a6;
        }

        .verde {
            background: #239b56;
        }

        .gris {
            background: #566573;
        }

        .tabla-contenedor {
            overflow-x: auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #243447;
            color: white;
        }

        .mensaje {
            background: #d5f5e3;
            color: #196f3d;
            padding: 12px;
            margin: 12px 0;
            border-radius: 5px;
        }

        .error {
            background: #fadbd8;
            color: #922b21;
            padding: 12px;
            margin: 12px 0;
            border-radius: 5px;
        }

        .sin-cupo {
            color: #c0392b;
            font-weight: bold;
        }

        .con-cupo {
            color: #239b56;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Clases disponibles del gimnasio</h1>

        <p>
            Bienvenido,
            <strong th:text="${usuario.nombre}"></strong>.
            Consulta los horarios y reserva tu espacio.
        </p>

        <div class="acciones">
            <a th:if="${usuario.rol == 'CLIENTE'}" th:href="@{/reservas/mis-reservas}" class="boton azul">
                Mis reservas
            </a>

            <a th:href="@{/usuarios/mi-perfil}" class="boton gris">
                Volver a mi perfil
            </a>
        </div>

        <div th:if="${mensaje}" class="mensaje" th:text="${mensaje}"></div>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <div class="tabla-contenedor">

            <table>
                <thead>
                    <tr>
                        <th>Clase</th>
                        <th>Tipo</th>
                        <th>Entrenador</th>
                        <th>Fecha</th>
                        <th>Hora de inicio</th>
                        <th>Hora de finalización</th>
                        <th>Capacidad</th>
                        <th>Ocupados</th>
                        <th>Disponibles</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="clase : ${clases}">

                        <td th:text="${clase.nombre}"></td>

                        <td th:text="${clase.tipo}"></td>

                        <td th:text="${clase.entrenador.nombre}"></td>

                        <td th:text="${clase.fecha}"></td>

                        <td th:text="${clase.horaInicio}"></td>

                        <td th:text="${clase.horaFin}"></td>

                        <td th:text="${clase.capacidadMaxima}"></td>

                        <td th:text="${ocupadosPorClase[clase.id]}"></td>

                        <td>
                            <span th:text="${disponiblesPorClase[clase.id]}" th:class="${disponiblesPorClase[clase.id] > 0
                              ? 'con-cupo' : 'sin-cupo'}">
                            </span>
                        </td>

                        <td>

                            <form th:if="${usuario.rol == 'CLIENTE' and disponiblesPorClase[clase.id] > 0}"
                                th:action="@{/reservas/crear/{id}(id=${clase.id})}" method="post">

                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <button type="submit" class="boton verde">
                                    Reservar
                                </button>

                            </form>

                            <span th:if="${usuario.rol != 'CLIENTE' and disponiblesPorClase[clase.id] > 0}"
                                style="color:#64748b;">
                                Solo clientes
                            </span>

                            <span th:if="${disponiblesPorClase[clase.id] == 0}" class="sin-cupo">
                                Sin cupos
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(clases)}">
                        <td colspan="10">
                            No hay clases registradas actualmente.
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>

    </div>

</body>

</html>
