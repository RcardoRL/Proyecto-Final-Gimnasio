
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #b91c1c;
            text-align: center;
            margin-top: 15px;
        }

        .enlace {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h2>🔒 Nueva contraseña</h2>

    <p>Ingresa tu nueva contraseña para recuperar el acceso.</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/restablecer-password}"
      method="post"
      th:if="${tokenInvalido == null or !tokenInvalido}">

        <input type="hidden"
               name="token"
               th:value="${token}">

        <label for="password">Nueva contraseña</label>
        <input type="password"
               id="password"
               name="password"
               minlength="8"
               required>

        <label for="confirmarPassword">Confirmar contraseña</label>
        <input type="password"
               id="confirmarPassword"
               name="confirmarPassword"
               minlength="8"
               required>

        <button type="submit">
            Guardar nueva contraseña
        </button>

    </form>

    <a class="enlace" th:href="@{/login}">
        Volver al inicio de sesión
    </a>

</div>

</body>
</html>
