

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de sesión | Gestión de Usuarios</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #243b55, #141e30);
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #2980b9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #2980b9;
            box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1f618d;
        }

        .mensaje {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            background: #fdecea;
            color: #b71c1c;
        }

        .exito {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .pie {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">👤</div>

        <h1>Bienvenido</h1>

        <p class="subtitulo">
            Sistema de Gestión de Usuarios
        </p>

        <div th:if="${param.error}" class="mensaje error">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="mensaje exito">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">

            <label for="username">Usuario</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Ingresa tu usuario"
                   autocomplete="username"
                   required>

            <label for="password">Contraseña</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Ingresa tu contraseña"
                   autocomplete="current-password"
                   required>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>


    </div>

</body>
</html>
