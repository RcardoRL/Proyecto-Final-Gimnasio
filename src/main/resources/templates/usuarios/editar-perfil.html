
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar mi perfil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #0002;
        }

        h2 {
            text-align: center;
            color: #183153;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .volver {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h2>Editar mi perfil</h2>

    <p th:if="${error}" th:text="${error}"
       style="color: red;"></p>

    <form th:action="@{/usuarios/mi-perfil/actualizar}"
          th:object="${usuario}"
          method="post">

        <label>Nombre completo</label>
        <input type="text" th:field="*{nombre}" required>

        <label>Nombre de usuario</label>
        <input type="text" th:field="*{username}" readonly>

        <label>Correo electrónico</label>
        <input type="email" th:field="*{email}" required>

        <label>Cédula</label>
        <input type="text" th:field="*{cedula}"
               maxlength="9" pattern="[0-9]{9}" required>

        <label>Teléfono</label>
        <input type="text" th:field="*{telefono}"
               maxlength="8" pattern="[0-9]{8}" required>

        <label>Nueva contraseña (opcional)</label>
        <input type="password" name="nuevaPassword"
               autocomplete="new-password"
               placeholder="Dejar vacío para conservar la actual">

        <button type="submit">Guardar cambios</button>

    </form>

    <a class="volver" th:href="@{/usuarios/mi-perfil}">
        Volver a mi perfil
    </a>

</div>

</body>
</html>
