<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del Usuario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            padding: 40px;
        }

        .contenedor {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #263238;
        }

        .dato {
            margin: 15px 0;
        }

        .dato strong {
            color: #34495e;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 15px;
            background-color: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .boton:hover {
            background-color: #1f618d;
        }

        /* Alinear los botones de acciones */
        .acciones {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            justify-content: flex-start;
        }

        .acciones .boton,
        .acciones button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
            padding: 0 15px;
            margin: 0 !important;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .acciones form {
            margin: 0 !important;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Detalle del Usuario</h1>

        <div class="dato">
            <strong>ID:</strong>
            <span th:text="${usuario.id}"></span>
        </div>

        <div class="dato">
            <strong>Nombre:</strong>
            <span th:text="${usuario.nombre}"></span>
        </div>

        <div class="dato">
            <strong>Usuario:</strong>
            <span th:text="${usuario.username}"></span>
        </div>

        <div class="dato">
            <strong>Correo:</strong>
            <span th:text="${usuario.email}"></span>
        </div>

        <div class="dato">
            <strong>Teléfono:</strong>
            <span th:text="${usuario.telefono}"></span>
        </div>

        <div class="dato">
            <strong>Rol:</strong>
            <span th:text="${usuario.rol}"></span>
        </div>

        <div class="dato">
            <strong>Estado:</strong>
            <span th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
        </div>

        <!-- Botones de acciones -->
        <div class="acciones">

            <!-- Editar el perfil propio -->
            <a th:if="${#authentication.name == usuario.username}" th:href="@{/usuarios/mi-perfil/editar}" class="boton"
                style="background-color: #2563eb;">
                Editar mi perfil
            </a>

            <a th:if="${usuario.rol == 'ENTRENADOR' and #authentication.name == usuario.username}"
                th:href="@{/reservas/clases}" class="boton" style="background-color:#198754;">
                Ver clases
            </a>

            <!-- Reservar clases: solo en el perfil propio del cliente -->
            <a th:if="${usuario.rol == 'CLIENTE' and #authentication.name == usuario.username}"
                th:href="@{/reservas/clases}" class="boton" style="background-color: #198754;">
                Reservar clases
            </a>

            <!-- Consultar las reservaciones del cliente -->
            <a th:if="${usuario.rol == 'CLIENTE' and #authentication.name == usuario.username}"
                th:href="@{/reservas/mis-reservas}" class="boton" style="background-color: #64748b;">
                Mis reservaciones
            </a>


            <!-- Solo los administradores pueden volver al listado -->
            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/usuarios}" class="boton">
                Volver a usuarios
            </a>

            <!-- Cerrar sesión -->
            <form th:action="@{/logout}" method="post">

                <button type="submit" class="boton" style="background-color: #dc3545;">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</body>

</html>
