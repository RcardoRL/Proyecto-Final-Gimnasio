
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #243b55, #141e30);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #243b55;
        }

        p {
            color: #666;
            text-align: center;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2980b9;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h2>Recuperar contraseña</h2>

    <p>
        Ingresa tu correo electrónico para solicitar el restablecimiento de tu contraseña.
    </p>

    <!-- Mensaje de confirmación -->
    <p th:if="${mensaje != null}"
       th:text="${mensaje}"
       style="color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;">
    </p>

    <form th:action="@{/recuperar-password}" method="post">

        <input type="email"
               name="email"
               placeholder="Correo electrónico"
               autocomplete="email"
               required>

        <button type="submit">
            Solicitar recuperación
        </button>

    </form>

    <a th:href="@{/login}" class="volver">
        Volver al inicio de sesión
    </a>

</div>

</body>
</html>
